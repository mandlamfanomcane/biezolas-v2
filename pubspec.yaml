name: biezolas_v2
description: BIEZOLAS Bus & Coach Ticketing System v2.0 - Complete transport operations management with offline support, biometric security, and real-time reporting.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.0
  firebase_storage: ^12.3.2
  local_auth: ^2.1.7
  blue_thermal_printer: ^1.2.3
  flutter_blue_plus: ^1.31.8
  mobile_scanner: ^4.0.1
  audioplayers: ^5.2.1
  geolocator: ^10.1.0
  permission_handler: ^11.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  workmanager: ^0.5.2
  connectivity_plus: ^5.0.2
  telephony: ^0.2.0
  pdf: ^3.10.8
  printing: ^5.12.0
  excel: ^4.0.3
  mailer: ^6.1.0
  path_provider: ^2.1.3
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  image_picker: ^1.0.7
  qr_code_scanner: ^0.8.0
  uuid: ^4.0.0
  animations: ^2.0.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/beep_once.mp3
    - assets/beep_continuous.mp3
